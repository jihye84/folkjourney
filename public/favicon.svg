<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <!-- Globe Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Circle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Globe Ring Glow -->
  <circle cx="28" cy="35" r="19" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.3"/>
  
  <!-- Globe Sphere -->
  <circle cx="28" cy="35" r="17" fill="#091428" stroke="url(#globeGrad)" stroke-width="2"/>
  
  <!-- Latitude / Longitude Grid Lines -->
  <ellipse cx="28" cy="35" rx="17" ry="7" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
  <ellipse cx="28" cy="35" rx="7.5" ry="17" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="11" y1="35" x2="45" y2="35" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="28" y1="18" x2="28" y2="52" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Glowing Gold Double Musical Note Overlay -->
  <!-- Note Head 1 -->
  <ellipse cx="36" cy="40" rx="4.5" ry="3.5" fill="#fbbf24" transform="rotate(-20 36 40)" filter="url(#glow)"/>
  <!-- Note Head 2 -->
  <ellipse cx="48" cy="35" rx="4.5" ry="3.5" fill="#fbbf24" transform="rotate(-20 48 35)" filter="url(#glow)"/>
  
  <!-- Note Stems -->
  <path d="M39.5 39 V 18 L 51.5 13 V 34" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Beamed Top Connection -->
  <path d="M38.5 18.5 L 52.5 13.5 V 17.5 L 38.5 22.5 Z" fill="#fbbf24" filter="url(#glow)"/>
</svg>